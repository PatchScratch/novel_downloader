name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/english-ui]
    paths:
      - "android/**"
      - "novel_downloader.py"
      - "font/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        env:
          NOVEL_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python3
        run: |
          PY="${NOVEL_BUILD_PYTHON}"
          if [ ! -x "$PY" ]; then PY="$(which python3.12 || which python3)"; fi
          export NOVEL_BUILD_PYTHON="$PY"
          "$PY" --version
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noveldownloader-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
